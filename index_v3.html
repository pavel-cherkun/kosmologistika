<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Орбита — прототип v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200;400;600&display=swap" rel="stylesheet">
<style>
:root{--fg:#f4f7fb;--dim:#8fb3d9;--cy:#66f0ff;--panel:rgba(12,34,66,.72);--line:rgba(102,240,255,.22)}
html,body{margin:0;height:100%;background:#0a1a33;color:var(--fg);font-family:"Exo 2",-apple-system,system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
#top{position:fixed;top:10px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;font-size:14px;gap:8px}
#stats{letter-spacing:.04em;color:var(--dim)}
#stats b{font-size:24px;font-weight:600;color:var(--fg)}
#wk{width:120px;height:3px;background:rgba(102,240,255,.15);border-radius:2px;margin-top:6px;overflow:hidden}
#wk i{display:block;height:100%;background:var(--cy);box-shadow:0 0 8px var(--cy);width:0}
#top .r{pointer-events:auto;display:flex;gap:6px}
button{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 11px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
button:hover{border-color:var(--cy)}
#bar{position:fixed;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:0 16px;font-size:13px}
.chip{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:3px 5px 3px 10px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.chip button{padding:1px 8px;border-radius:12px;font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;box-shadow:0 0 6px currentColor}
.res{color:var(--dim);padding:4px 10px;width:100%;text-align:center;letter-spacing:.03em}
#hint{position:fixed;top:66px;left:16px;right:16px;text-align:center;color:#d6ecff;font-size:15px;line-height:1.35;pointer-events:none;transition:opacity .5s;text-shadow:0 1px 8px #04101f}
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,12,26,.6);padding:16px}
.card{background:linear-gradient(180deg,#143a66,#0c2246);border:1px solid var(--line);border-radius:18px;padding:24px;max-width:440px;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.45)}
.card h2{margin:0 0 6px;font-size:22px;font-weight:400;letter-spacing:.08em}
.card p{margin:0;color:var(--dim);font-size:14px;line-height:1.45}
.opts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.opt{width:170px;padding:14px;text-align:left;border-radius:14px;background:rgba(255,255,255,.04)}
.opt b{display:block;font-size:15px;margin-bottom:4px;font-weight:600}
.opt span{color:var(--dim);font-size:13px}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:16px;background:radial-gradient(circle at 50% 45%,rgba(10,26,51,0) 0,rgba(6,16,34,.55) 70%)}
#start h1{font-weight:200;font-size:clamp(46px,13vw,96px);letter-spacing:.14em;margin:0 0 0 .14em;line-height:1}
#start h1 span{color:var(--cy);text-shadow:0 0 22px var(--cy)}
#start p{color:var(--dim);margin:6px 0 26px;letter-spacing:.18em;text-transform:uppercase;font-size:12px}
#go{font-size:18px;padding:12px 38px;border-radius:30px;border-color:var(--cy);box-shadow:0 0 28px rgba(102,240,255,.35);letter-spacing:.1em}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top">
  <div id="stats"><b id="score">0</b> грузов · нед. <span id="week">1</span><div id="wk"><i></i></div></div>
  <div class="r"><button id="bZo">−</button><button id="bZi">+</button><button id="bPause">❚❚</button><button id="bSpeed">1×</button></div>
</div>
<div id="hint"></div>
<div id="bar"></div>
<div id="modal"><div class="card" id="card"></div></div>
<div id="start"><h1>ОРБИТ<span>Λ</span></h1><p>логистика звёздной системы</p><button id="go">Начать</button></div>
<script>
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const TAU=Math.PI*2;
const LINE_COLORS=['#66f0ff','#ff8a3d','#ff6fb5','#b6f05a','#ffd24a','#a98bff','#3fd1a0','#ff5a5f'];
const SHAPES=['circle','triangle','square','diamond','star'];
// ресурсы планет: цвет, текстура, значок внутри
const RES={circle:{n:'вода',c:'#3fb6ff',tex:'swirl'},triangle:{n:'руда',c:'#ff8a3d',tex:'lava'},square:{n:'кристаллы',c:'#b07cff',tex:'crystal'},diamond:{n:'топливо',c:'#ffc94a',tex:'gas'},star:{n:'биомасса',c:'#3fd17a',tex:'crater'}};
// физика: периоды планет по Кеплеру
const GM=207600,EPS2=200,H_STEP=1/60,MAX_AGE=32,SUN_R=50,ASSIST=240,ASSIST_A=32,ESCAPE=1650;
const SPEED=175,OP=.12,WEEK=60,CAP=10,ST_CAP=20,OVER_TIME=30,SLING=1.8,AIM_SLOW=.15;
const RW={planet:16,giant:34,moon:9}; // физический радиус тела для столкновений
const periodFor=R=>TAU*Math.sqrt(R*R*R/GM);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let W,H,DPR,S,baseS,shx=0,shy=0;const cam={z:2.9,x:0,y:0,shake:0};
function setS(){S=baseS*cam.z;}
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';baseS=Math.max(.03,Math.min(W,H-130)/3000);setS();buildBg();}
const sx=x=>W/2+(x-cam.x)*S+shx, sy=y=>H/2+(y-cam.y)*S+shy;
function zoomAt(px,py,f){const wx=cam.x+(px-W/2)/S,wy=cam.y+(py-H/2)/S;cam.z=clamp(cam.z*f,.8,9);setS();cam.x=wx-(px-W/2)/S;cam.y=wy-(py-H/2)/S;clampCam();}
function clampCam(){cam.x=clamp(cam.x,-1500,1500);cam.y=clamp(cam.y,-1500,1500);}
// экранный радиус тел: растёт с зумом, но не мельче читаемого
const rpx=b=>b.kind==='giant'?clamp(44*S,26,60):b.kind==='moon'?clamp(11*S,7,16):clamp(24*S,17,38);
const sunPx=()=>clamp(SUN_R*S,16,64);

// ---------- фон и текстуры ----------
let bg=null;
function buildBg(){bg=document.createElement('canvas');bg.width=Math.max(1,W*DPR);bg.height=Math.max(1,H*DPR);const g=bg.getContext('2d');g.scale(DPR,DPR);
  let gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#143d68');gr.addColorStop(.55,'#0b1f3d');gr.addColorStop(1,'#081428');g.fillStyle=gr;g.fillRect(0,0,W,H);
  const R=rng(7);for(let i=0;i<5;i++){const x=R()*W,y=R()*H,r=(.3+R()*.5)*Math.max(W,H);gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,i%2?'rgba(40,110,170,.22)':'rgba(70,60,140,.16)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,0,W,H);}}
function rng(seed){let s=(seed*9301+49297)%233280;return()=>{s=(s*9301+49297)%233280;return s/233280;};}
function shade(hex,f){const n=parseInt(hex.slice(1),16),m=f<0?0:255,k=Math.abs(f);const c=[n>>16,n>>8&255,n&255].map(v=>Math.round(v+(m-v)*k));return `rgb(${c})`;}
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`;}
function makeTex(kind,col,seed){const N=128,c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d'),R=rng(seed);
  g.fillStyle=col;g.fillRect(0,0,N,N);g.lineCap='round';g.lineJoin='round';
  if(kind==='swirl'){for(let i=0;i<18;i++){g.strokeStyle=i%2?shade(col,.4):shade(col,-.35);g.lineWidth=3+R()*5;const x=R()*N,y=R()*N,r=8+R()*28,a=R()*TAU;g.beginPath();g.arc(x,y,r,a,a+2+R()*3);g.stroke();}}
  else if(kind==='lava'){for(let i=0;i<10;i++){g.fillStyle=shade(col,.25);g.beginPath();g.arc(R()*N,R()*N,8+R()*18,0,TAU);g.fill();}
    g.strokeStyle=shade(col,-.55);for(let i=0;i<9;i++){g.lineWidth=2+R()*3;g.beginPath();let x=R()*N,y=R()*N;g.moveTo(x,y);for(let k=0;k<6;k++){x+=(R()-.5)*34;y+=(R()-.5)*34;g.lineTo(x,y);}g.stroke();}}
  else if(kind==='crystal'){for(let i=0;i<46;i++){g.fillStyle=shade(col,(R()-.45)*.7);const x=R()*N,y=R()*N,s=10+R()*22;g.beginPath();g.moveTo(x,y);g.lineTo(x+(R()-.5)*s*2,y+R()*s);g.lineTo(x+(R()-.5)*s*2,y-R()*s);g.closePath();g.fill();}}
  else if(kind==='gas'){for(let y=-6;y<N+10;y+=9){g.fillStyle=shade(col,((y/9)%3-1)*.22);g.beginPath();g.moveTo(0,y);for(let x=0;x<=N;x+=8)g.lineTo(x,y+Math.sin(x*.08+y)*3);g.lineTo(N,y+12);g.lineTo(0,y+12);g.closePath();g.fill();}}
  else if(kind==='crater'){for(let i=0;i<14;i++){const x=R()*N,y=R()*N,r=5+R()*13;g.fillStyle=shade(col,-.32);g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
    g.strokeStyle=shade(col,.3);g.lineWidth=2;g.beginPath();g.arc(x,y,r,Math.PI*.9,Math.PI*1.8);g.stroke();}}
  else if(kind==='bands'){const cs=['#6a5a8a','#8a76a8','#d8b98a','#57487a','#b59ac4'];for(let y=0;y<N;y+=11){g.fillStyle=cs[(y/11|0)%cs.length];g.beginPath();g.moveTo(0,y);for(let x=0;x<=N;x+=8)g.lineTo(x,y+Math.sin(x*.06+y*.3)*2.5);g.lineTo(N,y+13);g.lineTo(0,y+13);g.closePath();g.fill();}
    g.fillStyle='rgba(255,180,140,.6)';g.beginPath();g.ellipse(80,74,13,7,0,0,TAU);g.fill();}
  return c;}
const stars=Array.from({length:190},()=>({x:Math.random(),y:Math.random(),a:Math.random()*.6+.15,r:Math.random()<.12?1.6:.9,d:.03+Math.random()*.1}));
const rocks=Array.from({length:110},()=>{const R=760+Math.random()*70;return {R,a0:Math.random()*TAU,T:periodFor(R),s:2+Math.random()*4.5,spin:(Math.random()-.5)*2,v:Array.from({length:6},()=>.65+Math.random()*.5)};});

// ---------- состояние ----------
let time,bodies,stations,routes,ships,shuttles,scouts,res,score,week,weekT,spawnT,gameOver,paused,speed,floats,flares,aim,dist,nextId,hintT,hints,modalOpen,colorI,started=false;
function reset(){
  time=0;bodies=[];stations=[];routes=[];ships=[];shuttles=[];scouts=[];floats=[];flares=[];nextId=1;colorI=0;
  res={scouts:4,ships:2,cap:6,dv:180};score=0;week=1;weekT=0;spawnT=7;gameOver=false;paused=false;speed=1;aim=null;modalOpen=false;hints={};
  cam.z=2.9;cam.x=0;cam.y=0;setS();
  const home=addBody({kind:'planet',shape:'circle',R:220,a0:.3});
  addBody({kind:'planet',shape:'triangle',R:420,a0:2.4});
  addBody({kind:'planet',shape:'square',R:610,a0:4.5});
  const g=addBody({kind:'giant',R:1000,a0:1.2});
  addBody({kind:'moon',parent:g,R:115,T:10,a0:0});
  addStation({kind:'orbital',host:home});
  home.queue.push({shape:'triangle'},{shape:'square'});
  recompute();if(started)setHint('Родная планета (вода) уже со станцией. Тяни от неё: стрелка — толчок разведчика, пунктир — его путь по гравитации. Попади в другую планету — там встанет станция. Пустое место — двигать карту, колесо или щипок — зум.');
  updateHud(true);hideModal();
}
function addBody(o){const b=Object.assign({id:nextId++,queue:[],over:0,pulse:0,born:time||0,gm:0,spin:(Math.random()-.5)*.3},o);
  if(b.kind!=='moon')b.T=periodFor(b.R);
  b.capR=b.kind==='giant'?95:b.kind==='moon'?40:80;
  if(b.kind==='giant'){b.gm=9000;b.tex=makeTex('bands','#6a5a8a',3);}
  else if(b.kind==='planet'){b.gm=600;b.tex=makeTex(RES[b.shape].tex,RES[b.shape].c,b.id*17+5);}
  else b.tex=makeTex('crater','#8a93a6',b.id*11);
  bodies.push(b);place(b);return b;}
function addStation(o){const s=Object.assign({id:nextId++,queue:[],over:0,pulse:0,born:time,a0:Math.random()*TAU},o);
  if(s.kind==='orbital'){s.Rs=55;s.Ts=10;s.shape=s.host.shape;s.host.station=s;}
  if(s.kind==='giant'){s.Rs=72;s.Ts=7;s.host.station=s;}
  if(s.kind==='moon'){s.Rs=16;s.Ts=4;s.host.station=s;}
  stations.push(s);place(s);
  if(s.kind==='orbital')shuttles.push({st:s,pl:s.host,at:'planet',state:'dock',t:.5,cargo:[],el:0,T:1});
  return s;}
function posAt(o,t){
  if(o.kind==='lagrange'){const p=o.parent,a=p.a0+TAU*t/p.T+o.off;return [Math.cos(a)*p.R,Math.sin(a)*p.R];}
  if(o.host){const h=posAt(o.host,t),a=o.a0+TAU*t/o.Ts;return [h[0]+Math.cos(a)*o.Rs,h[1]+Math.sin(a)*o.Rs];}
  if(o.parent){const h=posAt(o.parent,t),a=o.a0+TAU*t/o.T;return [h[0]+Math.cos(a)*o.R,h[1]+Math.sin(a)*o.R];}
  const a=o.a0+TAU*t/o.T;return [Math.cos(a)*o.R,Math.sin(a)*o.R];}
function velAt(o,t){const a=posAt(o,t-.01),b=posAt(o,t+.01);return [(b[0]-a[0])/.02,(b[1]-a[1])/.02];}
// спутники (станции, луны) на экране всегда снаружи нарисованного тела
function place(o){const p=posAt(o,time);o.x=p[0];o.y=p[1];
  const h=o.host||(o.kind==='moon'?o.parent:null);
  if(h){const dx=o.x-h.x,dy=o.y-h.y,d=Math.hypot(dx,dy)||1,Rw=o.host?o.Rs:o.R,
      min=rpx(h)+(o.host?(h.kind==='moon'?7:10):rpx(o)+5+(Rw/90)*10),rr=Math.max(Rw*S,min);
    o.sx=h.sx+dx/d*rr;o.sy=h.sy+dy/d*rr;}
  else{o.sx=sx(o.x);o.sy=sy(o.y);}}
const offOf=o=>[o.sx-sx(o.x),o.sy-sy(o.y)];
const capOf=o=>o.host||o.kind==='lagrange'?ST_CAP:CAP;

// ---------- маршрутизация по сети станций ----------
function recompute(){
  const adj=new Map(stations.map(s=>[s.id,[]]));
  for(const r of routes){adj.get(r.a.id).push(r.b.id);adj.get(r.b.id).push(r.a.id);}
  dist={};
  for(const sh of SHAPES){const d={};let q=[];for(const s of stations)if(s.shape===sh){d[s.id]=0;q.push(s.id);}
    while(q.length){const nq=[];for(const id of q)for(const n of adj.get(id))if(d[n]===undefined){d[n]=d[id]+1;nq.push(n);}q=nq;}dist[sh]=d;}
}
const D=(sh,s)=>{const v=dist[sh][s.id];return v===undefined?Infinity:v;};

// ---------- кривые переходов: по ходу орбит, в обход Солнца и планет ----------
function pro(p){const r=Math.hypot(p[0],p[1])||1;return [-p[1]/r,p[0]/r];}
function hostsOf(st){const h=st.host;return h?[h,h.parent].filter(Boolean):[];}
function obstacles(t,excl){const out=[{x:0,y:0,R:Math.max(SUN_R*2,sunPx()*1.9/S)}];
  for(const b of bodies){if(excl.includes(b))continue;const p=posAt(b,t);out.push({x:p[0],y:p[1],R:(rpx(b)+14)/S});}return out;}
function bez(p0,c1,c2,p3,t){const u=1-t;return [u*u*u*p0[0]+3*u*u*t*c1[0]+3*u*t*t*c2[0]+t*t*t*p3[0],u*u*u*p0[1]+3*u*u*t*c1[1]+3*u*t*t*c2[1]+t*t*t*p3[1]];}
function ctrl(pa,pb,obs){const len=Math.hypot(pb[0]-pa[0],pb[1]-pa[1])||1,k=len*.42,ta=pro(pa),tb=pro(pb);
  const c1=[pa[0]+ta[0]*k,pa[1]+ta[1]*k],c2=[pb[0]-tb[0]*k,pb[1]-tb[1]*k];
  for(let it=0;it<12;it++){let worst=0,wx=0,wy=0,wt=.5;
    for(let i=1;i<20;i++){const t=i/20,q=bez(pa,c1,c2,pb,t);
      for(const o of obs){const dx=q[0]-o.x,dy=q[1]-o.y,d=Math.hypot(dx,dy),v=o.R-d;
        if(v>worst){worst=v;let nx=dx,ny=dy;if(d<1e-3){nx=-(pb[1]-pa[1]);ny=pb[0]-pa[0];}const nl=Math.hypot(nx,ny)||1;wx=nx/nl;wy=ny/nl;wt=t;}}}
    if(worst<=0)return [c1,c2];const p=worst*2.4+4,w1=1.3-wt,w2=wt+.3;c1[0]+=wx*p*w1;c1[1]+=wy*p*w1;c2[0]+=wx*p*w2;c2[1]+=wy*p*w2;}
  // не разошлись — явный обход звезды по той стороне, где середина отрезка
  const sun=obs[0],dx=pb[0]-pa[0],dy=pb[1]-pa[1];let nx=-dy/len,ny=dx/len;const mx=(pa[0]+pb[0])/2,my=(pa[1]+pb[1])/2;
  if(nx*mx+ny*my<0||(Math.abs(mx)+Math.abs(my)<1&&nx*ta[0]+ny*ta[1]<0)){nx=-nx;ny=-ny;}
  const h=sun.R*2.6;return [[pa[0]+nx*h+dx*.1,pa[1]+ny*h+dy*.1],[pb[0]+nx*h-dx*.1,pb[1]+ny*h-dy*.1]];}
function bezLen(p0,c1,c2,p3){let L=0,p=p0;for(let k=1;k<=14;k++){const q=bez(p0,c1,c2,p3,k/14);L+=Math.hypot(q[0]-p[0],q[1]-p[1]);p=q;}return L;}
function flight(A,B,t0,v){const pa=posAt(A,t0),ex=[...hostsOf(A),...hostsOf(B)];let pb=posAt(B,t0),T=1,c=null;
  for(let k=0;k<3;k++){c=ctrl(pa,pb,obstacles(t0+T/2,ex));T=Math.max(1.2,bezLen(pa,c[0],c[1],pb)/v);pb=posAt(B,t0+T);}
  c=ctrl(pa,pb,obstacles(t0+T/2,ex));return {p0:pa,c1:c[0],c2:c[1],p3:pb,T,el:0};}

// ---------- грузовики между станциями ----------
function newShip(r){const s={route:r,e:0,state:'dock',t:.4,cargo:[],x:r.a.x,y:r.a.y,ang:0,boost:1,fl:null,trail:[]};ships.push(s);return s;}
function updateShip(s,dt){
  const E=s.e?s.route.b:s.route.a,O=s.e?s.route.a:s.route.b;
  if(s.state==='dock'){s.x=E.x;s.y=E.y;s.t-=dt;if(s.t>0)return;
    if(s.unload&&s.cargo.length){E.queue.push(s.cargo.pop());s.t=OP;return;}s.unload=false;
    if(s.cargo.length<res.cap)for(let k=0;k<E.queue.length;k++){const c=E.queue[k];if(D(c.shape,O)<D(c.shape,E)){s.cargo.push(c);E.queue.splice(k,1);s.t=OP;return;}}
    s.boost=E.kind==='giant'?SLING:1;s.fl=flight(E,O,time,SPEED*s.boost);s.state='fly';
    if(s.boost>1){flares.push({o:E,t:0,c:s.route.color});tone(196,.25,'sawtooth',.04);tip('sling','Праща! Грузовики, стартующие со станции у гиганта, летят почти вдвое быстрее.');}
    return;}
  const f=s.fl;f.el+=dt;const t=Math.min(1,f.el/f.T),p=bez(f.p0,f.c1,f.c2,f.p3,t),q=bez(f.p0,f.c1,f.c2,f.p3,Math.min(1,t+.01));

// ---------- челноки планета ⇄ своя станция ----------
function updateShuttle(u,dt){
  const P=u.pl,St=u.st;
  if(u.state==='dock'){u.t-=dt;if(u.t>0)return;
    if(u.at==='planet'){
      const di=u.cargo.findIndex(c=>c.shape===P.shape);if(di>=0){u.cargo.splice(di,1);deliver(P);u.t=OP;return;}
      if(u.cargo.length<res.cap)for(let k=0;k<P.queue.length;k++){const c=P.queue[k];if(D(c.shape,St)<Infinity){u.cargo.push(c);P.queue.splice(k,1);u.t=OP;return;}}
    }else{
      if(u.unload&&u.cargo.length){St.queue.push(u.cargo.pop());u.t=OP;return;}u.unload=false;
      for(let k=0;k<St.queue.length&&u.cargo.length<res.cap;k++){const c=St.queue[k];if(c.shape===P.shape){u.cargo.push(c);St.queue.splice(k,1);u.t=OP;return;}}
    }
    u.state='fly';u.el=0;u.T=.9;return;}
  u.el+=dt;if(u.el>=u.T){u.at=u.at==='planet'?'station':'planet';u.state='dock';u.t=.2;u.unload=true;}

function deliver(b){score++;b.pulse=1;floats.push({x:b.x,y:b.y,t:0});tone([523,587,659,784,880][score%5],.18,'sine',.05);}

// ---------- разведчик: честная гравитация ----------
function massive(){return bodies.filter(b=>b.gm);}
function targets(){const out=[];
  for(const b of bodies)out.push({kind:'body',b,capR:b.capR,pos:t=>posAt(b,t)});
  for(const s of stations)if(s.kind==='lagrange')out.push({kind:'station',s,capR:48,pos:t=>posAt(s,t)});
  for(const p of bodies)if(p.kind==='planet'||p.kind==='giant')for(const off of [TAU/6,-TAU/6]){
    if(stations.some(s=>s.kind==='lagrange'&&s.parent===p&&s.off===off))continue;
    const v={kind:'lagrange',parent:p,off};out.push({kind:'lpt',v,capR:48,pos:t=>posAt(v,t)});}
  return out;}
function physStep(p,ms,tg,origin){let r2=p.x*p.x+p.y*p.y+EPS2,r=Math.sqrt(r2),f=-GM/(r2*r),ax=f*p.x,ay=f*p.y;
  for(const m of ms){const q=posAt(m,p.t),dx=q[0]-p.x,dy=q[1]-p.y,d2=dx*dx+dy*dy+EPS2,d=Math.sqrt(d2),g=m.gm/(d2*d);ax+=g*dx;ay+=g*dy;}
  // «магнит» цели: автопилот доводит разведчика, если он прошёл рядом
  for(const g of tg){if(g.b===origin.host||g.s===origin)continue;const q=g.pos(p.t),dx=q[0]-p.x,dy=q[1]-p.y,d=Math.hypot(dx,dy);if(d<ASSIST&&d>1){const k=ASSIST_A*(1-d/ASSIST)/d;ax+=dx*k;ay+=dy*k;}}
  p.vx+=ax*H_STEP;p.vy+=ay*H_STEP;p.x+=p.vx*H_STEP;p.y+=p.vy*H_STEP;p.t+=H_STEP;p.age+=H_STEP;}
function hitTest(p,tg,origin){const r=Math.hypot(p.x,p.y);if(r<SUN_R)return {type:'sun'};if(r>ESCAPE||p.age>MAX_AGE)return {type:'lost'};
  const oh=origin.host;if(oh){const q=posAt(oh,p.t);if(Math.hypot(q[0]-p.x,q[1]-p.y)<RW[oh.kind])return {type:'crash'};}
  for(const g of tg){if(g.b===oh||g.s===origin)continue;const q=g.pos(p.t);if(Math.hypot(q[0]-p.x,q[1]-p.y)<g.capR)return {type:'capture',g,at:q};}
  return null;}
function launchState(origin,dv,t){const o=posAt(origin,t),v=velAt(origin,t);return {x:o[0],y:o[1],vx:v[0]+dv[0],vy:v[1]+dv[1],t,age:0,acc:0,trail:[],origin,off:offOf(origin)};}
function predict(origin,dv){const p=launchState(origin,dv,time),ms=massive(),tg=targets(),pts=[];let out=null;
  for(let i=0;i<MAX_AGE/H_STEP;i++){physStep(p,ms,tg,origin);if(i%3===0)pts.push(p.x,p.y,p.age);out=hitTest(p,tg,origin);if(out)break;}
  return {pts,out:out||{type:'lost'},end:[p.x,p.y],off:p.off};}
function launch(origin,dv){if(res.scouts<=0){setHint('Разведчиков нет. Новые — в конце недели.');return;}
  res.scouts--;scouts.push(launchState(origin,dv,time));flares.push({o:origin,t:0,c:'#66f0ff'});cam.shake=5;tone(220,.12,'square',.04);setTimeout(()=>tone(440,.25,'triangle',.05),60);updateHud(true);}
function updateScouts(dt){const ms=massive(),tg=targets();
  for(const p of scouts){p.acc+=dt;while(p.acc>=H_STEP&&!p.done){p.acc-=H_STEP;physStep(p,ms,tg,p.origin);if(((p.age/H_STEP)|0)%3===0){p.trail.push(p.x,p.y,p.age);if(p.trail.length>180)p.trail.splice(0,3);}
    const h=hitTest(p,tg,p.origin);if(h){p.done=true;resolveScout(p,h);}}}
  scouts=scouts.filter(p=>!p.done);}
function resolveScout(p,h){
  if(h.type!=='capture'){floats.push({x:p.x,y:p.y,t:0,text:h.type==='sun'?'сгорел':h.type==='crash'?'разбился':'потерян',bad:true});tone(110,.4,'sawtooth',.04);cam.shake=3;
    tip('lost','Разведчик потерян. Пунктир при прицеливании показывает весь путь: кружок — захват, крестик — потеря.');return;}
  let st;const g=h.g;
  if(g.kind==='station')st=g.s;
  else if(g.kind==='lpt')st=addStation({kind:'lagrange',parent:g.v.parent,off:g.v.off});
  else{const b=g.b;st=b.station||addStation({kind:b.kind==='planet'?'orbital':b.kind,host:b});}
  if(st!==p.origin&&!routes.some(r=>(r.a===p.origin&&r.b===st)||(r.b===p.origin&&r.a===st))){
    const r={a:p.origin,b:st,color:LINE_COLORS[colorI++%LINE_COLORS.length]};routes.push(r);if(res.ships-ships.length>0)newShip(r);}
  flares.push({o:st,t:0,c:'#f4f7fb',big:1});floats.push({x:st.x,y:st.y,t:0,text:'станция!'});cam.shake=4;[392,494,587].forEach((f,i)=>setTimeout(()=>tone(f,.3,'triangle',.05),i*90));
  recompute();updateHud(true);
  if(st.kind==='orbital')tip('route','Трасса освоена. Челнок возит грузы с планеты на её станцию, межпланетный грузовик — между станциями.');
  if(st.kind==='lagrange')tip('lag','Станция Лагранжа: идёт вместе с планетой на 60° от неё. Склад и пересадка.');
  if(st.kind==='giant')tip('giant','Станция у гиганта — праща: грузовики с неё стартуют почти вдвое быстрее.');

// ---------- спрос ----------
function pick(arr,w){const sum=w.reduce((a,b)=>a+b,0);let x=Math.random()*sum;for(let k=0;k<arr.length;k++){x-=w[k];if(x<=0)return arr[k];}return arr[0];}
function spawn(){const pl=bodies.filter(b=>b.kind==='planet'&&time-b.born>(b.station?0:40));if(!pl.length)return;
  const b=pick(pl,pl.map(q=>q.station?1:.35));
  // заказы чаще туда, куда уже можно довезти
  const sh=[...new Set(bodies.filter(q=>q.kind==='planet'&&q.shape!==b.shape).map(q=>q.shape))];
  const based=x=>stations.some(s=>s.shape===x);b.queue.push({shape:pick(sh,sh.map(x=>based(x)?1:.4))});}
function freeOrbit(){for(let k=0;k<120;k++){const R=300+Math.random()*1150;
  if(R>720&&R<870)continue;if(Math.abs(R-1000)<200)continue;if(bodies.every(b=>b.kind==='moon'||Math.abs(b.R-R)>80))return R;}return 1380+Math.random()*60;}
function unlock(){
  if(week===2)addBody({kind:'planet',shape:'diamond',R:1250,a0:Math.random()*TAU});
  else if(week===3)addBody({kind:'moon',parent:bodies.find(b=>b.kind==='giant'),R:165,T:16,a0:Math.random()*TAU});
  else if(week===4)addBody({kind:'planet',shape:'star',R:1420,a0:Math.random()*TAU});
  else{const sh=[...new Set(bodies.filter(b=>b.kind==='planet').map(b=>b.shape))];addBody({kind:'planet',shape:sh[Math.random()*sh.length|0],R:freeOrbit(),a0:Math.random()*TAU});}
  recompute();}

// ---------- маршруты: управление ----------
function dump(s,at){for(const c of s.cargo)at.queue.push(c);s.cargo=[];}
function deleteRoute(r){for(const s of ships.filter(s=>s.route===r))dump(s,s.e?r.b:r.a);ships=ships.filter(s=>s.route!==r);routes=routes.filter(x=>x!==r);recompute();updateHud(true);}
function addShip(r){if(res.ships-ships.length>0){newShip(r);updateHud(true);}}
function removeShip(r){const ls=ships.filter(s=>s.route===r);if(ls.length<=1)return;const s=ls[ls.length-1];dump(s,s.e?r.b:r.a);ships.splice(ships.indexOf(s),1);updateHud(true);}

// ---------- ввод: прицеливание, перемещение и зум ----------
function originAt(px,py){let best=null,bd=32;
  for(const s of stations){const h=s.host&&s.host.kind==='planet'?s.host:s;for(const o of [s,h]){const d=Math.hypot(o.sx-px,o.sy-py);if(d<bd){bd=d;best=s;}}}
  return best;}
let audio=null,pan=null;const ptrs=new Map();
cv.addEventListener('pointerdown',e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(ptrs.size===2){aim=null;pan={pinch:true,d:pdist(),z:cam.z};return;}
  if(gameOver||modalOpen||!started)return;
  const o=originAt(e.clientX,e.clientY);
  if(o)aim={origin:o,x0:e.clientX,y0:e.clientY,px:e.clientX,py:e.clientY};else pan={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};
});
function pdist(){const [a,b]=[...ptrs.values()];return Math.hypot(a.x-b.x,a.y-b.y)||1;}
cv.addEventListener('pointermove',e=>{if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(aim){aim.px=e.clientX;aim.py=e.clientY;return;}
  if(pan&&pan.pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];zoomAt((a.x+b.x)/2,(a.y+b.y)/2,pan.z*pdist()/pan.d/cam.z);}
  else if(pan&&!pan.pinch){cam.x=pan.cx-(e.clientX-pan.x)/S;cam.y=pan.cy-(e.clientY-pan.y)/S;clampCam();}});
// сила толчка зависит от длины жеста на экране, а не от зума
// толчок = вектор жеста от точки касания
function aimDv(a=aim){const dx=a.px-a.x0,dy=a.py-a.y0,L=Math.hypot(dx,dy)||1,m=Math.min(L*1.3,res.dv);return [dx/L*m,dy/L*m,L];}

// ---------- HUD ----------
const $=id=>document.getElementById(id);
let hudSig='';
const symOf=s=>s.kind==='orbital'?`<span style="color:${RES[s.shape].c}">${RES[s.shape].n}</span>`:s.kind==='lagrange'?'L-станция':s.kind==='giant'?'гигант':'луна';
function updateHud(force){
  $('score').textContent=score;$('week').textContent=week;$('wk').firstChild.style.width=(weekT/WEEK*100)+'%';
  const sig=routes.map(r=>r.color+ships.filter(s=>s.route===r).length).join()+'|'+res.scouts+'|'+(res.ships-ships.length)+res.cap;
  if(!force&&sig===hudSig)return;hudSig=sig;
  let h=routes.map((r,i)=>`<div class="chip"><span class="dot" style="background:${r.color};color:${r.color}"></span>${symOf(r.a)} ↔ ${symOf(r.b)} · ${ships.filter(s=>s.route===r).length}
    <button data-a="add" data-i="${i}">+</button><button data-a="rem" data-i="${i}">−</button><button data-a="del" data-i="${i}">×</button></div>`).join('');
  h+=`<div class="res">разведчиков ${res.scouts} · грузовиков в запасе ${res.ships-ships.length} · трюм ${res.cap}</div>`;

$('bar').addEventListener('click',e=>{const t=e.target.closest('button');if(!t||gameOver)return;const r=routes[+t.dataset.i];if(!r)return;
  if(t.dataset.a==='add')addShip(r);else if(t.dataset.a==='rem')removeShip(r);else deleteRoute(r);});
$('bPause').onclick=()=>{if(gameOver||modalOpen||!started)return;paused=!paused;$('bPause').textContent=paused?'▶':'❚❚';};
$('bZi').onclick=()=>zoomAt(W/2,H/2,1.25);$('bZo').onclick=()=>zoomAt(W/2,H/2,.8);
$('bSpeed').onclick=()=>{speed=speed===1?2:1;$('bSpeed').textContent=speed+'×';};
$('go').onclick=()=>{started=true;$('start').style.display='none';try{audio=new (window.AudioContext||window.webkitAudioContext)();}catch(_){audio=false;}reset();};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('bPause').onclick();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused&&!gameOver&&!modalOpen&&started)$('bPause').onclick();});
function setHint(t){const el=$('hint');el.style.opacity=0;setTimeout(()=>{el.textContent=t;el.style.opacity=1;},250);hintT=14;}
function tip(k,t){if(hints[k])return;hints[k]=1;setHint(t);}
function hideModal(){$('modal').style.display='none';modalOpen=false;}
function showModal(html){$('card').innerHTML=html;$('modal').style.display='flex';modalOpen=true;aim=null;}
const UPG={
  scout:{t:'Разведчики',d:'+2 разведчика',ok:()=>true,go:()=>res.scouts+=2},
  ship:{t:'Грузовик',d:'+1 межпланетный грузовик',ok:()=>true,go:()=>res.ships++},
  cap:{t:'Трюмы',d:'грузовики и челноки везут на 2 груза больше',ok:()=>res.cap<12,go:()=>res.cap+=2},
  dv:{t:'Двигатель',d:'разведчик толкается на 30% сильнее',ok:()=>res.dv<300,go:()=>res.dv=Math.round(res.dv*1.3)},

  week++;res.scouts++;res.ships++;unlock();
  const keys=Object.keys(UPG).filter(k=>UPG[k].ok()).sort(()=>Math.random()-.5).slice(0,2);
  const news=week===2?'на окраине появилась планета с топливом':week===3?'у гиганта новая луна':week===4?'на окраине появилась планета с биомассой':'появилась новая планета';
  showModal(`<h2>Неделя ${week}</h2><p>+1 разведчик, +1 грузовик, ${news}. Выбери одно:</p>
    <div class="opts">${keys.map(k=>`<button class="opt" data-k="${k}"><b>${UPG[k].t}</b><span>${UPG[k].d}</span></button>`).join('')}</div>`);
  $('card').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{UPG[b.dataset.k].go();hideModal();updateHud(true);});

function lose(){gameOver=true;let best=0;try{best=+localStorage.getItem('orbita3_best')||0;if(score>best)localStorage.setItem('orbita3_best',score);}catch(_){}
  showModal(`<h2>Склад переполнен</h2><p>Грузы не дождались кораблей.<br>Доставлено <b style="color:#f4f7fb">${score}</b> · неделя ${week}${best?` · рекорд ${Math.max(best,score)}`:''}</p>
    <div class="opts"><button class="opt" id="again" style="text-align:center;width:auto"><b>Ещё раз</b></button></div>`);

// ---------- звук ----------
function tone(f,dur,type,vol){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+dur);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+dur);}

// ---------- цикл ----------
function placeAll(){for(const b of bodies)place(b);for(const s of stations)place(s);}
function update(dt){
  time+=dt;weekT+=dt;placeAll();
  spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(1.5,6.5*Math.pow(.9,week-1))*(.7+Math.random()*.6);}
  updateScouts(dt);
  for(const s of ships)updateShip(s,dt);
  for(const u of shuttles)updateShuttle(u,dt);
  for(const o of [...bodies,...stations]){const cap=capOf(o);if(o.queue.length>cap)o.over+=dt/OVER_TIME;else o.over=Math.max(0,o.over-dt/30);o.pulse=Math.max(0,o.pulse-dt*2);
    if(o.over>=1&&!gameOver){lose();return;}}
  for(const f of floats)f.t+=dt;floats=floats.filter(f=>f.t<1.2);
  for(const f of flares)f.t+=dt;flares=flares.filter(f=>f.t<1.2);
  if(weekT>=WEEK){weekT=0;weekEnd();}
}

// ---------- отрисовка ----------
function drawShape(sh,x,y,r){ctx.beginPath();
  if(sh==='circle')ctx.arc(x,y,r,0,TAU);
  else if(sh==='triangle'){for(let k=0;k<3;k++){const a=-Math.PI/2+k*TAU/3;ctx.lineTo(x+Math.cos(a)*r*1.2,y+Math.sin(a)*r*1.2+r*.15);}ctx.closePath();}
  else if(sh==='square')ctx.rect(x-r*.85,y-r*.85,r*1.7,r*1.7);
  else if(sh==='diamond'){ctx.moveTo(x,y-r*1.15);ctx.lineTo(x+r,y);ctx.lineTo(x,y+r*1.15);ctx.lineTo(x-r,y);ctx.closePath();}
  else if(sh==='star'){for(let k=0;k<10;k++){const a=-Math.PI/2+k*TAU/10,rr=k%2?r*.5:r*1.2;ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}ctx.closePath();}}
function drawQueue(o,x,y){const over=o.queue.length>capOf(o);
  o.queue.forEach((c,k)=>{const qx=x+(k%5)*10,qy=y+Math.floor(k/5)*10;ctx.fillStyle=RES[c.shape].c;drawShape(c.shape,qx,qy,3.5);ctx.fill();
    ctx.strokeStyle=over?'#ff5a5f':'rgba(4,16,31,.7)';ctx.lineWidth=1;ctx.stroke();});}
function drawOver(o,R){if(o.over<=0)return;ctx.lineWidth=3.5;ctx.strokeStyle='rgba(255,90,95,.25)';ctx.beginPath();ctx.arc(o.sx,o.sy,R,0,TAU);ctx.stroke();
  ctx.strokeStyle='#ff5a5f';ctx.beginPath();ctx.arc(o.sx,o.sy,R,-Math.PI/2,-Math.PI/2+TAU*o.over);ctx.stroke();}
// шар с текстурой: свет со стороны звезды, ободок и мягкое свечение
function drawSphere(b,x,y,r,glow){
  const d=Math.hypot(b.x,b.y)||1,lx=-b.x/d,ly=-b.y/d;
  let g=ctx.createRadialGradient(x,y,r*.8,x,y,r*2);g.addColorStop(0,rgba(glow,.22));g.addColorStop(1,rgba(glow,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*2,0,TAU);ctx.fill();
  ctx.save();ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.clip();
  ctx.translate(x,y);ctx.rotate(time*b.spin);ctx.drawImage(b.tex,-r*1.05,-r*1.05,r*2.1,r*2.1);ctx.setTransform(DPR,0,0,DPR,0,0);
  g=ctx.createRadialGradient(x+lx*r*.55,y+ly*r*.55,r*.1,x-lx*r*.2,y-ly*r*.2,r*1.3);g.addColorStop(0,'rgba(255,255,255,.28)');g.addColorStop(.5,'rgba(4,10,25,0)');g.addColorStop(1,'rgba(4,10,25,.8)');
  ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);ctx.restore();
  const a=Math.atan2(ly,lx);ctx.strokeStyle='rgba(210,250,255,.85)';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(x,y,r-.5,a-1.1,a+1.1);ctx.stroke();}
function drawPlanet(b){const x=b.sx,y=b.sy,age=Math.min(1,(time-b.born)/1.2),r=rpx(b)*(.4+.6*age),col=RES[b.shape].c,based=!!b.station;
  ctx.globalAlpha=based?1:.85;drawSphere(b,x,y,r,col);
  ctx.fillStyle='rgba(4,16,31,.45)';ctx.beginPath();ctx.arc(x,y,r*.5,0,TAU);ctx.fill();
  ctx.fillStyle='#f4f7fb';drawShape(b.shape,x,y,r*.27);ctx.fill();ctx.globalAlpha=1;
  if(!based){ctx.strokeStyle=rgba(col,.85);ctx.lineWidth=1.5;ctx.setLineDash([3,4]);ctx.lineDashOffset=-time*6;ctx.beginPath();ctx.arc(x,y,r+6,0,TAU);ctx.stroke();ctx.setLineDash([]);}
  if(age<1){ctx.strokeStyle=rgba(col,1-age);ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r+40*age,0,TAU);ctx.stroke();}
  ctx.fillStyle=rgba(col,.9);ctx.font='600 10px "Exo 2",system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(RES[b.shape].n.toUpperCase(),x,y+r+15);
  drawQueue(b,x+r+10,y-r+2);}
function drawStation(s){const x=s.sx,y=s.sy;
  ctx.save();ctx.translate(x,y);ctx.rotate(time*.6+s.id);
  ctx.fillStyle='#66f0ff';ctx.shadowColor='#66f0ff';ctx.shadowBlur=6;ctx.fillRect(-13,-2,6,4);ctx.fillRect(7,-2,6,4);ctx.shadowBlur=0;
  ctx.strokeStyle='#cfe3f5';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(-7,0);ctx.lineTo(7,0);ctx.stroke();
  ctx.fillStyle='#f4f7fb';ctx.beginPath();ctx.arc(0,0,4.5,0,TAU);ctx.fill();ctx.fillStyle='#8fa6bf';ctx.beginPath();ctx.arc(0,0,1.8,0,TAU);ctx.fill();ctx.restore();
  if(s.kind==='lagrange'){ctx.fillStyle='#66f0ff';ctx.font='600 9px "Exo 2",system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('L',x,y-11);}}
function drawFreighter(x,y,ang,col,cargo,boost){const L=20;
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  ctx.shadowColor='#66f0ff';ctx.shadowBlur=boost>1?16:9;ctx.fillStyle='rgba(120,240,255,.9)';const fl=5+Math.random()*3*(boost>1?2:1);
  for(const oy of [-3,3]){ctx.beginPath();ctx.ellipse(-L/2-fl/2,oy,fl/2+1,1.6,0,0,TAU);ctx.fill();}ctx.shadowBlur=0;
  ctx.fillStyle='#f4f7fb';ctx.beginPath();ctx.moveTo(-L/2,-5.5);ctx.lineTo(L/2-5,-5.5);ctx.lineTo(L/2,-2);ctx.lineTo(L/2,2);ctx.lineTo(L/2-5,5.5);ctx.lineTo(-L/2,5.5);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(110,135,170,.45)';ctx.fillRect(-L/2,1.5,L-4,4);ctx.fillStyle='#b9cadd';ctx.fillRect(L/2-10,-2.5,4,5);
  ctx.fillStyle=col;ctx.fillRect(-L/2,-5.5,L-6,1.8);
  for(let k=0;k<Math.min(cargo.length,4);k++){ctx.fillStyle=RES[cargo[k].shape].c;ctx.fillRect(-L/2+2+k*3.4,-1.2,2.6,2.6);}
  ctx.restore();}
function drawSun(cx,cy){const r=sunPx();
  ctx.save();ctx.translate(cx,cy);ctx.rotate(time*.02);ctx.fillStyle='rgba(150,235,255,.035)';const L=Math.max(W,H)*1.4;
  for(let k=0;k<14;k++){const a=k*TAU/14;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a-.035)*L,Math.sin(a-.035)*L);ctx.lineTo(Math.cos(a+.035)*L,Math.sin(a+.035)*L);ctx.closePath();ctx.fill();}ctx.restore();
  let g=ctx.createRadialGradient(cx,cy,0,cx,cy,r*5);g.addColorStop(0,'rgba(120,230,255,.4)');g.addColorStop(1,'rgba(120,230,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r*5,0,TAU);ctx.fill();
  g=ctx.createRadialGradient(cx,cy,0,cx,cy,r*1.3);g.addColorStop(0,'#ffffff');g.addColorStop(.6,'#e6fdff');g.addColorStop(1,'rgba(150,240,255,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,r*1.3,0,TAU);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,cy,r*.8,0,TAU);ctx.fill();
  ctx.lineCap='round';ctx.strokeStyle='#4fe3ff';ctx.shadowColor='#4fe3ff';ctx.shadowBlur=10;
  for(const [rr,sp,n,w] of [[1.65,.35,7,3],[2.05,-.22,10,2]]){ctx.lineWidth=w;ctx.globalAlpha=rr>2?.55:.95;for(let k=0;k<n;k++){const a=time*sp+k*TAU/n;ctx.beginPath();ctx.arc(cx,cy,r*rr,a,a+TAU/n*.55);ctx.stroke();}}
  ctx.globalAlpha=1;ctx.shadowBlur=0;}
function polyPath(pts,offA,offB){ctx.beginPath();const n=pts.length;for(let i=0;i<n;i++){const t=i/(n-1);ctx.lineTo(sx(pts[i][0])+offA[0]*(1-t)+offB[0]*t,sy(pts[i][1])+offA[1]*(1-t)+offB[1]*t);}}
function render(){
  if(W<2||H<2)return;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.drawImage(bg,0,0,W,H);
  for(const s of stars){const px=((s.x*W-cam.x*S*s.d)%W+W)%W,py=((s.y*H-cam.y*S*s.d)%H+H)%H;ctx.fillStyle=`rgba(210,235,255,${s.a*(.7+.3*Math.sin(time*1.3+s.x*50))})`;ctx.fillRect(px,py,s.r,s.r);}
  const cx=sx(0),cy=sy(0);
  drawSun(cx,cy);
  // орбиты: тонкая линия + шлейф за телом + точки Лагранжа
  for(const b of bodies){if(b.kind==='moon'){ctx.strokeStyle='rgba(143,179,217,.16)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(b.parent.sx,b.parent.sy,Math.hypot(b.sx-b.parent.sx,b.sy-b.parent.sy),0,TAU);ctx.stroke();continue;}
    const col=b.kind==='giant'?'#d8b98a':RES[b.shape].c,a=Math.atan2(b.y,b.x),R=b.R*S;
    ctx.strokeStyle='rgba(143,179,217,.14)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,R,0,TAU);ctx.stroke();
    for(let k=0;k<6;k++){ctx.strokeStyle=rgba(col,.35*(1-k/6));ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,R,a-(k+1)*.1,a-k*.1);ctx.stroke();}
    for(const off of [TAU/6,-TAU/6]){if(stations.some(s=>s.kind==='lagrange'&&s.parent===b&&s.off===off))continue;
      const la=a+off,x=cx+Math.cos(la)*R,y=cy+Math.sin(la)*R,hot=aim?.9:.35;
      ctx.strokeStyle=rgba(col,hot);ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(x,y-5);ctx.lineTo(x+4,y);ctx.lineTo(x,y+5);ctx.lineTo(x-4,y);ctx.closePath();ctx.stroke();
      ctx.fillStyle=rgba(col,hot);ctx.font='600 9px "Exo 2",system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(off>0?'L4':'L5',x,y-8);}}
  // пояс астероидов
  for(const k of rocks){const a=k.a0+TAU*time/k.T,x=sx(Math.cos(a)*k.R),y=sy(Math.sin(a)*k.R);if(x<-10||x>W+10||y<-10||y>H+10)continue;
    const s=clamp(k.s*S*1.6,1.5,10);ctx.save();ctx.translate(x,y);ctx.rotate(time*k.spin);
    ctx.fillStyle='#c4521e';ctx.beginPath();k.v.forEach((v,i)=>{const t=i*TAU/6;ctx.lineTo(Math.cos(t)*s*v,Math.sin(t)*s*v);});ctx.closePath();ctx.fill();
    ctx.fillStyle='#ff9a4d';ctx.beginPath();ctx.moveTo(0,0);for(let i=3;i<6;i++){const t=i*TAU/6;ctx.lineTo(Math.cos(t)*s*k.v[i],Math.sin(t)*s*k.v[i]);}ctx.closePath();ctx.fill();ctx.restore();}
  // трассы: дуга в обход тел, «течёт» по ходу
  ctx.lineCap='round';ctx.lineJoin='round';
  for(const r of routes){const pa=[r.a.x,r.a.y],pb=[r.b.x,r.b.y],[c1,c2]=ctrl(pa,pb,obstacles(time,[...hostsOf(r.a),...hostsOf(r.b)])),pts=[];
    for(let i=0;i<=28;i++)pts.push(bez(pa,c1,c2,pb,i/28));const oa=offOf(r.a),ob=offOf(r.b);
    ctx.strokeStyle=r.color;ctx.globalAlpha=.16;ctx.lineWidth=9;polyPath(pts,oa,ob);ctx.stroke();
    ctx.globalAlpha=.9;ctx.lineWidth=2.2;ctx.setLineDash([10,8]);ctx.lineDashOffset=-time*18;polyPath(pts,oa,ob);ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=1;}
  // факел разведчика
  for(const p of scouts){const tr=p.trail,n=tr.length;let prev=null;for(let k=0;k<n;k+=3){const f=k/n,o=Math.max(0,1-tr[k+2]),x=sx(tr[k])+p.off[0]*o,y=sy(tr[k+1])+p.off[1]*o;
    if(prev){ctx.strokeStyle=`rgba(102,240,255,${f*.8})`;ctx.lineWidth=1+3*f;ctx.beginPath();ctx.moveTo(prev[0],prev[1]);ctx.lineTo(x,y);ctx.stroke();}prev=[x,y];}}
  for(const s of ships)if(s.trail.length>2){ctx.strokeStyle=s.route.color;ctx.lineWidth=3;ctx.globalAlpha=.4;ctx.beginPath();for(let k=0;k<s.trail.length;k+=2)ctx.lineTo(sx(s.trail[k]),sy(s.trail[k+1]));ctx.stroke();ctx.globalAlpha=1;}
  // тела
  for(const b of bodies){const x=b.sx,y=b.sy,r=rpx(b);
    if(b.kind==='giant'){drawSphere(b,x,y,r,'#b59ac4');ctx.strokeStyle='rgba(216,185,138,.9)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y,r*1.75,r*.42,-.35,Math.PI*.98,Math.PI*2.02);ctx.stroke();}
    else if(b.kind==='moon')drawSphere(b,x,y,r,'#8a93a6');
    else drawPlanet(b);
    if(b.pulse>0){ctx.strokeStyle=`rgba(244,247,251,${b.pulse})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,r+6+(1-b.pulse)*16,0,TAU);ctx.stroke();}
    drawOver(b,r+9);}
  // станции и их орбиты (всегда снаружи тела)
  for(const s of stations){if(s.host){ctx.strokeStyle='rgba(244,247,251,.16)';ctx.lineWidth=1;ctx.setLineDash([2,4]);ctx.beginPath();ctx.arc(s.host.sx,s.host.sy,Math.hypot(s.sx-s.host.sx,s.sy-s.host.sy),0,TAU);ctx.stroke();ctx.setLineDash([]);}
    drawStation(s);
    if(time-s.born<1.2){const a=(time-s.born)/1.2;ctx.strokeStyle=`rgba(102,240,255,${1-a})`;ctx.lineWidth=2;ctx.beginPath();ctx.arc(s.sx,s.sy,8+60*a,0,TAU);ctx.stroke();}
    drawQueue(s,s.sx+14,s.sy-14);drawOver(s,16);}
  // челноки: короткая дуга планета ⇄ станция
  for(const u of shuttles){const A=u.at==='planet'?u.pl:u.st,B=u.at==='planet'?u.st:u.pl;let x=A.sx,y=A.sy;
    if(u.state==='fly'){const t=Math.min(1,u.el/u.T),e=t*t*(3-2*t),dx=B.sx-A.sx,dy=B.sy-A.sy,side=u.at==='planet'?1:-1,c=[A.sx+dx/2-dy*.5*side,A.sy+dy/2+dx*.5*side],v=1-e;
      x=v*v*A.sx+2*v*e*c[0]+e*e*B.sx;y=v*v*A.sy+2*v*e*c[1]+e*e*B.sy;}
    ctx.fillStyle=u.cargo.length?RES[u.cargo[0].shape].c:'#f4f7fb';ctx.shadowColor='#66f0ff';ctx.shadowBlur=6;ctx.beginPath();ctx.arc(x,y,2.8,0,TAU);ctx.fill();ctx.shadowBlur=0;}
  // грузовики
  for(const s of ships){const E=s.e?s.route.b:s.route.a,O=s.e?s.route.a:s.route.b;let x,y;
    if(s.state==='dock'){x=E.sx;y=E.sy;}else{const t=s.ft||0,oe=offOf(E),oo=offOf(O);x=sx(s.x)+oe[0]*(1-t)+oo[0]*t;y=sy(s.y)+oe[1]*(1-t)+oo[1]*t;}
    drawFreighter(x,y,s.ang,s.route.color,s.cargo,s.boost);}
  for(const p of scouts){const o=Math.max(0,1-p.age),x=sx(p.x)+p.off[0]*o,y=sy(p.y)+p.off[1]*o,a=Math.atan2(p.vy,p.vx);ctx.save();ctx.translate(x,y);ctx.rotate(a);
    ctx.fillStyle='#66f0ff';ctx.shadowColor='#66f0ff';ctx.shadowBlur=10;ctx.beginPath();ctx.ellipse(-8,0,4+Math.random()*2,1.8,0,0,TAU);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#f4f7fb';ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(-5,4.5);ctx.lineTo(-3,0);ctx.lineTo(-5,-4.5);ctx.closePath();ctx.fill();ctx.restore();}
  // прицел
  if(aim){const o=aim.origin,dv=aimDv(),pred=predict(o,dv);
    if(dv[2]>=22){const ok=pred.out.type==='capture',P=pred.pts;ctx.strokeStyle=ok?'rgba(244,247,251,.9)':'rgba(255,138,141,.8)';ctx.lineWidth=2;ctx.setLineDash([3,6]);ctx.lineDashOffset=-time*30;
      ctx.beginPath();for(let k=0;k<P.length;k+=3){const w=Math.max(0,1-P[k+2]);ctx.lineTo(sx(P[k])+pred.off[0]*w,sy(P[k+1])+pred.off[1]*w);}ctx.stroke();ctx.setLineDash([]);
      if(ok){const q=pred.out.at,pr=(Math.sin(time*40)+1)/2;ctx.strokeStyle='#66f0ff';ctx.shadowColor='#66f0ff';ctx.shadowBlur=10;ctx.lineWidth=2;ctx.beginPath();ctx.arc(sx(q[0]),sy(q[1]),18+pr*3,0,TAU);ctx.stroke();ctx.shadowBlur=0;}
      else{const e=pred.end,x=sx(e[0]),y=sy(e[1]);ctx.strokeStyle='#ff8a8d';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x-5,y-5);ctx.lineTo(x+5,y+5);ctx.moveTo(x+5,y-5);ctx.lineTo(x-5,y+5);ctx.stroke();}
      const L=Math.hypot(dv[0],dv[1]),ux=dv[0]/L,uy=dv[1]/L,al=18+70*L/res.dv;ctx.strokeStyle='#66f0ff';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(o.sx,o.sy);ctx.lineTo(o.sx+ux*al,o.sy+uy*al);ctx.lineTo(o.sx+ux*(al-7)-uy*5,o.sy+uy*(al-7)+ux*5);ctx.moveTo(o.sx+ux*al,o.sy+uy*al);ctx.lineTo(o.sx+ux*(al-7)+uy*5,o.sy+uy*(al-7)-ux*5);ctx.stroke();
      ctx.fillStyle='#66f0ff';ctx.font='600 12px "Exo 2",system-ui,sans-serif';ctx.textAlign='center';ctx.fillText(res.scouts>0?`Δv ${Math.round(L)}`:'нет разведчиков',o.sx,o.sy-26);}}
  for(const f of flares){const T=f.big?1.2:.8;ctx.strokeStyle=f.c;ctx.globalAlpha=Math.max(0,1-f.t/T);ctx.lineWidth=f.big?4:3;ctx.beginPath();ctx.arc(f.o.sx,f.o.sy,10+f.t*(f.big?90:50),0,TAU);ctx.stroke();ctx.globalAlpha=1;}
  ctx.font='600 14px "Exo 2",system-ui,sans-serif';ctx.textAlign='center';
  for(const f of floats){ctx.fillStyle=f.bad?`rgba(255,138,141,${1-f.t/1.2})`:`rgba(244,247,251,${1-f.t/1.2})`;ctx.fillText(f.text||'+1',sx(f.x),sy(f.y)-24-f.t*24);}
  // планеты за краем экрана — стрелка у кромки
  for(const b of bodies){if(b.kind!=='planet')continue;const x=b.sx,y=b.sy,m=26;if(x>m&&x<W-m&&y>90&&y<H-110)continue;
    const ex=clamp(x,m,W-m),ey=clamp(y,90,H-110),a=Math.atan2(y-ey,x-ex);
    ctx.save();ctx.translate(ex,ey);ctx.rotate(a);ctx.fillStyle=rgba(RES[b.shape].c,b.queue.length>capOf(b)*.7?1:.75);ctx.beginPath();ctx.moveTo(8,0);ctx.lineTo(-5,6);ctx.lineTo(-5,-6);ctx.closePath();ctx.fill();ctx.restore();
    ctx.fillStyle='#fff';drawShape(b.shape,ex-Math.cos(a)*12,ey-Math.sin(a)*12,3.5);ctx.fill();}
  if(paused&&!modalOpen){ctx.fillStyle='rgba(244,247,251,.6)';ctx.font='600 16px "Exo 2",system-ui,sans-serif';ctx.fillText('пауза',W/2,H-90);}
}
let last=performance.now(),hudT=0;
function frame(now){const raw=Math.min(.05,(now-last)/1000);last=now;
  cam.shake=Math.max(0,cam.shake-raw*20);shx=(Math.random()-.5)*cam.shake;shy=(Math.random()-.5)*cam.shake;
  if(started&&!paused&&!gameOver&&!modalOpen)update(raw*speed*(aim?AIM_SLOW:1));
  else{if(!started)time+=raw*.5;placeAll();}
  hintT-=raw;if(hintT<=0&&hintT>-1)$('hint').style.opacity=0;
  hudT-=raw;if(hudT<=0){hudT=.2;if(started)updateHud();}
  try{render();}catch(err){console.error(err);}
  requestAnimationFrame(frame);}
// отладка/тесты
window.G={get s(){return {score,week,time,routes,ships,shuttles,stations,bodies,scouts,res,cam}},step:(n=1,dt=1/30)=>{for(let k=0;k<n&&!gameOver&&!modalOpen;k++)update(dt);},
  start:()=>$('go').onclick(),predict:(stId,dv)=>predict(stations.find(s=>s.id===stId),dv),launch:(stId,dv)=>launch(stations.find(s=>s.id===stId),dv),weekEnd:()=>weekEnd()};
addEventListener('resize',resize);resize();reset();$('hint').style.opacity=0;$('bar').innerHTML='';requestAnimationFrame(frame);
</script>
